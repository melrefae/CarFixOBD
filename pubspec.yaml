name: automotive_scanner
description: AutoSpect - OBD2 diagnostic and vehicle inspection app for workshops.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management & Utilities
  provider: ^6.1.1
  intl: ^0.20.2
  shared_preferences: ^2.2.2

  # Hardware Connectivity (Bluetooth, BLE GATT, USB OTG & Sockets)
  flutter_bluetooth_serial: ^0.4.0
  flutter_blue_plus: ^1.35.5
  usb_serial: ^0.5.2
  ffi: ^2.1.0
  permission_handler: ^11.3.0

  # High-Performance Real-Time Charting
  fl_chart: ^0.66.2

  # PDF Generation & Printing
  pdf: ^3.10.8
  printing: ^5.12.0
  share_plus: ^7.2.2

  # Local Database
  sqflite: ^2.3.2
  path: ^1.9.0

  # UI & Styling
  google_fonts: ^6.1.0
  flutter_animate: ^4.5.0
  cupertino_icons: ^1.0.6
  image_picker: ^1.2.4
  path_provider: ^2.1.6
  url_launcher: ^6.3.3
  file_picker: ^8.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/databases/
    - assets/images/
  fonts:
    - family: NotoSansArabic
      fonts:
        - asset: assets/fonts/NotoSansArabic-Regular.ttf
        - asset: assets/fonts/NotoSansArabic-Bold.ttf
          weight: 700
